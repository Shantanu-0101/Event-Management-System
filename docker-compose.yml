# Local PostgreSQL for development. Start with: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventapp
      POSTGRES_PASSWORD: eventapp
      POSTGRES_DB: eventapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventapp -d eventapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
