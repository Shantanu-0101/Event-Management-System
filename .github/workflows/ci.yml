name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway database to prove the migrations and seed still run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eventapp
          POSTGRES_PASSWORD: eventapp
          POSTGRES_DB: eventapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventapp -d eventapp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eventapp:eventapp@localhost:5432/eventapp?schema=public
      SEED_ADMIN_EMAIL: ci-admin@example.com
      SEED_ADMIN_PASSWORD: ci-only-password-not-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (also generates the Prisma client)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed
        run: npm run db:seed

      - name: Integration tests (real database, including parallel registration)
        run: npm run test:integration

      - name: Install the browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build, desktop and phone)
        run: npm run test:e2e

      - name: Keep the test report when a run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
